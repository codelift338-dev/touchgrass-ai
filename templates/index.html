<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TouchGrass AI</title>
    
    <style>
        * {
            box-sizing: border-box;
        }
    
        body {
            margin: 0;
            min-height: 100vh;
    
            font-family: Arial, Helvetica, sans-serif;
    
            background:
                linear-gradient(
                    135deg,
                    #dcedc8,
                    #e8f5e9,
                    #c8e6c9
                );
    
            color: #173b20;
    
            display: flex;
            justify-content: center;
            align-items: center;
    
            padding: 20px;
        }
    
        .app {
            width: 100%;
            max-width: 620px;
    
            background: rgba(255, 255, 255, 0.96);
    
            border-radius: 28px;
    
            padding: 35px;
    
            box-shadow:
                0 20px 50px rgba(0, 70, 20, 0.18);
        }
    
        .logo {
            font-size: 55px;
            text-align: center;
        }
    
        h1 {
            text-align: center;
    
            margin: 8px 0;
    
            color: #2e7d32;
        }
    
        .subtitle {
            text-align: center;
    
            color: #607d63;
    
            margin-bottom: 30px;
    
            line-height: 1.5;
        }
    
        label {
            display: block;
    
            margin-top: 18px;
            margin-bottom: 7px;
    
            font-weight: bold;
        }
    
        select,
        input,
        textarea {
            width: 100%;
    
            padding: 14px;
    
            border: 2px solid #c8e6c9;
    
            border-radius: 13px;
    
            font-size: 16px;
    
            background: white;
    
            font-family: inherit;
        }
    
        select:focus,
        input:focus,
        textarea:focus {
            outline: none;
    
            border-color: #66bb6a;
        }
    
        textarea {
            min-height: 130px;
    
            resize: vertical;
    
            line-height: 1.5;
        }
    
        button {
            width: 100%;
    
            margin-top: 20px;
    
            padding: 16px;
    
            border: none;
    
            border-radius: 15px;
    
            background: #2e7d32;
    
            color: white;
    
            font-size: 18px;
    
            font-weight: bold;
    
            cursor: pointer;
    
            transition: 0.2s;
        }
    
        button:hover {
            background: #1b5e20;
    
            transform: translateY(-1px);
        }
    
        button:disabled {
            background: #9e9e9e;
    
            cursor: wait;
    
            transform: none;
        }
    
        .secondary-button {
            background: #558b2f;
        }
    
        .secondary-button:hover {
            background: #33691e;
        }
    
        .danger-button {
            background: #c62828;
        }
    
        .danger-button:hover {
            background: #8e0000;
        }
    
        #result {
            display: none;
    
            margin-top: 30px;
    
            padding: 28px;
    
            background: #f1f8e9;
    
            border: 2px solid #dcedc8;
    
            border-radius: 22px;
        }
    
        .mission-label {
            text-align: center;
    
            color: #689f38;
    
            font-size: 14px;
    
            font-weight: bold;
    
            letter-spacing: 1px;
        }
    
        .mission-title {
            text-align: center;
    
            color: #33691e;
    
            font-size: 27px;
    
            margin: 12px 0 22px;
        }
    
        .step {
            display: flex;
    
            gap: 12px;
    
            margin: 14px 0;
    
            padding: 14px;
    
            background: white;
    
            border-radius: 14px;
    
            box-shadow:
                0 3px 10px rgba(0, 70, 20, 0.05);
        }
    
        .step-number {
            min-width: 30px;
    
            height: 30px;
    
            display: flex;
    
            align-items: center;
    
            justify-content: center;
    
            background: #66bb6a;
    
            color: white;
    
            border-radius: 50%;
    
            font-weight: bold;
        }
    
        .step-text {
            line-height: 1.5;
        }
    
        .reminder {
            margin-top: 22px;
    
            padding: 18px;
    
            background: #fffde7;
    
            border-radius: 14px;
    
            text-align: center;
    
            color: #5d4037;
    
            font-weight: bold;
    
            line-height: 1.5;
        }
    
        .go-outside {
            background: #1b5e20;
        }
    
        .go-outside:hover {
            background: #0d3b12;
        }
    
        .error {
            margin-top: 20px;
    
            padding: 15px;
    
            background: #ffebee;
    
            color: #b71c1c;
    
            border-radius: 12px;
    
            display: none;
    
            line-height: 1.5;
        }
    
        .outdoor-mode {
            min-height: 520px;
    
            display: flex;
    
            flex-direction: column;
    
            justify-content: center;
    
            align-items: center;
    
            text-align: center;
        }
    
        .big-tree {
            font-size: 80px;
    
            margin-bottom: 10px;
    
            animation:
                gentleFloat 3s ease-in-out infinite;
        }
    
        @keyframes gentleFloat {
    
            0% {
                transform: translateY(0);
            }
    
            50% {
                transform: translateY(-8px);
            }
    
            100% {
                transform: translateY(0);
            }
        }
    
        .outdoor-mode h1 {
            font-size: 38px;
    
            color: #1b5e20;
    
            letter-spacing: 2px;
    
            margin: 10px 0;
        }
    
        .outdoor-message {
            font-size: 20px;
    
            color: #558b2f;
    
            margin: 8px;
    
            line-height: 1.4;
        }
    
        .timer {
            font-size: 64px;
    
            font-weight: bold;
    
            color: #2e7d32;
    
            margin: 30px 0 10px;
    
            font-variant-numeric: tabular-nums;
        }
    
        .timer-message {
            color: #78909c;
    
            font-size: 14px;
    
            margin-bottom: 10px;
        }
    
        .back-button {
            background: #558b2f;
    
            max-width: 300px;
        }
    
        .reflection {
            min-height: 520px;
    
            display: flex;
    
            flex-direction: column;
    
            justify-content: center;
        }
    
        .reflection-icon {
            text-align: center;
    
            font-size: 70px;
        }
    
        .reflection h1 {
            font-size: 32px;
    
            margin-bottom: 10px;
        }
    
        .reflection-text {
            text-align: center;
    
            color: #607d63;
    
            line-height: 1.5;
    
            margin-bottom: 25px;
        }
    
        .score-card {
            margin-top: 25px;
    
            padding: 25px;
    
            background: #f1f8e9;
    
            border-radius: 18px;
    
            text-align: center;
        }
    
        .score-number {
            font-size: 48px;
    
            font-weight: bold;
    
            color: #2e7d32;
        }
    
        .score-label {
            color: #558b2f;
    
            font-weight: bold;
        }
    
        .history-card {
            margin-top: 20px;
    
            padding: 18px;
    
            background: #fffde7;
    
            border-radius: 14px;
    
            color: #5d4037;
    
            line-height: 1.6;
        }
    
        .history-empty {
            text-align: center;
    
            padding: 25px;
    
            color: #607d63;
        }
    
        .privacy-note {
            margin-top: 20px;
    
            padding: 15px;
    
            background: #e8f5e9;
    
            border-radius: 12px;
    
            color: #33691e;
    
            text-align: center;
    
            font-size: 14px;
    
            line-height: 1.5;
        }
    
        @media (max-width: 600px) {
    
            body {
                padding: 10px;
            }
    
            .app {
                padding: 24px;
    
                border-radius: 20px;
            }
    
            .logo {
                font-size: 45px;
            }
    
            .mission-title {
                font-size: 23px;
            }
    
            .outdoor-mode h1 {
                font-size: 30px;
            }
    
            .timer {
                font-size: 52px;
            }
    
            .reflection h1 {
                font-size: 27px;
            }
        }
    </style>
    
    </head> <body> <div class="app" id="app">
    <div id="setup">
    
        <div class="logo">
            🌱
        </div>
    
        <h1>
            TouchGrass AI
        </h1>
    
        <p class="subtitle">
            Your local AI-powered outdoor companion.
        </p>
    
        <label for="activity">
            What do you want to do?
        </label>
    
        <select id="activity">
    
            <option value="walking">
                🚶 Walking
            </option>
    
            <option value="exploring">
                🥾 Exploring
            </option>
    
            <option value="gardening">
                🌻 Gardening
            </option>
    
            <option value="birdwatching">
                🐦 Birdwatching
            </option>
    
            <option value="photography">
                📷 Nature photography
            </option>
    
        </select>
    
        <label for="minutes">
            How much time do you have?
        </label>
    
        <input
            id="minutes"
            type="number"
            min="5"
            max="120"
            value="10"
        >
    
        <button
            id="generateButton"
            onclick="generateMission()"
        >
            🌳 Give Me a Mission
        </button>
    
        <button
            class="secondary-button"
            onclick="showHistory()"
        >
            📖 View My History
        </button>
    
    </div>
    
    <div
        id="error"
        class="error"
    ></div>
    
    <div id="result">
    
        <div class="mission-label">
            YOUR OUTDOOR MISSION
        </div>
    
        <div
            id="missionTitle"
            class="mission-title"
        ></div>
    
        <div id="steps"></div>
    
        <div
            id="reminder"
            class="reminder"
        ></div>
    
        <button
            class="go-outside"
            onclick="startOutdoorMode()"
        >
            🌳 I'm Going Outside
        </button>
    
        <button
            class="secondary-button"
            onclick="resetMission()"
        >
            🔄 New Mission
        </button>
    
    </div>
    
    </div> <script>
    let remainingSeconds = 600;
    
    let timerInterval = null;
    
    let selectedMinutes = 10;
    
    let currentMission = null;
    
    /* Generate mission */
    
    async function generateMission() {
    
    const button =
        document.getElementById(
            "generateButton"
        );
    
    const result =
        document.getElementById(
            "result"
        );
    
    const errorBox =
        document.getElementById(
            "error"
        );
    
    const activity =
        document.getElementById(
            "activity"
        ).value;
    
    const minutes =
        Number(
            document.getElementById(
                "minutes"
            ).value
        );
    
    if (
        !minutes ||
        minutes < 5 ||
        minutes > 120
    ) {
    
        errorBox.textContent =
            "Please choose between 5 and 120 minutes.";
    
        errorBox.style.display =
            "block";
    
        return;
    }
    
    button.disabled = true;
    
    button.textContent =
        "🤖 Local AI is thinking...";
    
    result.style.display =
        "none";
    
    errorBox.style.display =
        "none";
    
    try {
    
        const response =
            await fetch(
                "/generate",
                {
                    method: "POST",
    
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
    
                    body: JSON.stringify({
                        activity: activity,
                        minutes: minutes
                    })
                }
            );
    
        const data =
            await response.json();
    
        if (!data.success) {
    
            throw new Error(
                data.error ||
                "The local AI could not generate a mission."
            );
        }
    
        currentMission =
            data.mission;
    
        document.getElementById(
            "missionTitle"
        ).textContent =
            data.mission.title;
    
        const stepsContainer =
            document.getElementById(
                "steps"
            );
    
        stepsContainer.innerHTML =
            "";
    
        data.mission.steps.forEach(
            function(step, index) {
    
                const stepElement =
                    document.createElement(
                        "div"
                    );
    
                stepElement.className =
                    "step";
    
                const number =
                    document.createElement(
                        "div"
                    );
    
                number.className =
                    "step-number";
    
                number.textContent =
                    index + 1;
    
                const text =
                    document.createElement(
                        "div"
                    );
    
                text.className =
                    "step-text";
    
                text.textContent =
                    step;
    
                stepElement.appendChild(
                    number
                );
    
                stepElement.appendChild(
                    text
                );
    
                stepsContainer.appendChild(
                    stepElement
                );
    
            }
        );
    
        document.getElementById(
            "reminder"
        ).textContent =
            data.mission.reminder;
    
        selectedMinutes =
            minutes;
    
        result.style.display =
            "block";
    
        result.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });
    
    }
    
    catch (error) {
    
        errorBox.textContent =
            "Something went wrong: " +
            error.message;
    
        errorBox.style.display =
            "block";
    
    }
    
    finally {
    
        button.disabled =
            false;
    
        button.textContent =
            "🌳 Give Me a Mission";
    
    }
    
    }
    
    /* Start outdoor mode */
    
    function startOutdoorMode() {
    
    if (timerInterval) {
    
        clearInterval(
            timerInterval
        );
    
    }
    
    remainingSeconds =
        selectedMinutes * 60;
    
    const app =
        document.getElementById(
            "app"
        );
    
    app.innerHTML = `
    
        <div class="outdoor-mode">
    
            <div class="big-tree">
                🌳
            </div>
    
            <h1>
                GO OUTSIDE.
            </h1>
    
            <p class="outdoor-message">
                Your mission is ready.
            </p>
    
            <p class="outdoor-message">
                📵 Put your phone away.
            </p>
    
            <div
                id="timer"
                class="timer"
            >
                ${formatTime(remainingSeconds)}
            </div>
    
            <p class="timer-message">
                We'll see you when you're back.
            </p>
    
            <button
                class="back-button"
                onclick="finishOutdoorMode()"
            >
                🌱 I'm Back
            </button>
    
        </div>
    
    `;
    
    timerInterval =
        setInterval(
            updateTimer,
            1000
        );
    
    }
    
    /* Update timer */
    
    function updateTimer() {
    
    const timer =
        document.getElementById(
            "timer"
        );
    
    if (!timer) {
        return;
    }
    
    timer.textContent =
        formatTime(
            remainingSeconds
        );
    
    if (
        remainingSeconds <= 0
    ) {
    
        clearInterval(
            timerInterval
        );
    
        timerInterval =
            null;
    
        timer.textContent =
            "🌳 DONE!";
    
        return;
    }
    
    remainingSeconds--;
    
    }
    
    /* Format timer */
    
    function formatTime(totalSeconds) {
    
    const minutes =
        Math.floor(
            totalSeconds / 60
        );
    
    const seconds =
        totalSeconds % 60;
    
    return (
        String(minutes)
            .padStart(2, "0")
        +
        ":"
        +
        String(seconds)
            .padStart(2, "0")
    );
    
    }
    
    /* Finish outdoor mode */
    
    function finishOutdoorMode() {
    
    if (timerInterval) {
    
        clearInterval(
            timerInterval
        );
    
        timerInterval = null;
    }
    
    showReflection();
    
    }
    
    /* Reflection */
    
    function showReflection() {
    
    const app =
        document.getElementById(
            "app"
        );
    
    app.innerHTML = `
    
        <div class="reflection">
    
            <div class="reflection-icon">
                🌿
            </div>
    
            <h1>
                What did you notice?
            </h1>
    
            <p class="reflection-text">
                Take a moment to remember
                something you saw, heard,
                smelled, or felt outside.
            </p>
    
            <textarea
                id="reflectionText"
                placeholder="I noticed..."
                maxlength="500"
            ></textarea>
    
            <button
                onclick="saveReflection()"
            >
                🌱 Save Reflection
            </button>
    
            <button
                class="secondary-button"
                onclick="skipReflection()"
            >
                Skip
            </button>
    
        </div>
    
    `;
    
    }
    
    /* Save reflection */
    
    function saveReflection() {
    
    const text =
        document.getElementById(
            "reflectionText"
        ).value.trim();
    
    if (!text) {
    
        alert(
            "Write one thing you noticed outside first."
        );
    
        return;
    }
    
    saveSession(text);
    
    showCompletion();
    
    }
    
    /* Skip reflection */
    
    function skipReflection() {
    
    saveSession("");
    
    showCompletion();
    
    }
    
    /* Save session locally */
    
    function saveSession(reflection) {
    
    const history =
        JSON.parse(
            localStorage.getItem(
                "touchGrassHistory"
            ) || "[]"
        );
    
    history.push({
    
        date:
            new Date().toLocaleString(),
    
        minutes:
            selectedMinutes,
    
        activity:
            document.getElementById(
                "activity"
            )?.value || "outdoor",
    
        mission:
            currentMission,
    
        reflection:
            reflection
    
    });
    
    localStorage.setItem(
        "touchGrassHistory",
        JSON.stringify(history)
    );
    
    }
    
    /* Completion */
    
    function showCompletion() {
    
    const history =
        JSON.parse(
            localStorage.getItem(
                "touchGrassHistory"
            ) || "[]"
        );
    
    const score =
        history.reduce(
            function(total, item) {
    
                return (
                    total +
                    Number(
                        item.minutes || 0
                    )
                );
    
            },
            0
        );
    
    const app =
        document.getElementById(
            "app"
        );
    
    app.innerHTML = `
    
        <div class="reflection">
    
            <div class="reflection-icon">
                🌳
            </div>
    
            <h1>
                Welcome Back!
            </h1>
    
            <p class="reflection-text">
                You successfully spent
                time away from the screen.
            </p>
    
            <div class="score-card">
    
                <div class="score-number">
                    ${score}
                </div>
    
                <div class="score-label">
                    TOTAL MINUTES OUTSIDE
                </div>
    
                <br>
    
                <div class="score-label">
                    ${history.length}
                    OUTDOOR SESSIONS
                </div>
    
            </div>
    
            <div class="privacy-note">
                🔒 Your missions and reflections
                are stored only on this device.
                <br><br>
                No account. No cloud database.
                No tracking.
            </div>
    
            <button
                onclick="location.reload()"
            >
                🌱 Start Another Mission
            </button>
    
            <button
                class="secondary-button"
                onclick="showHistory()"
            >
                📖 View My History
            </button>
    
        </div>
    
    `;
    
    }
    
    /* Show history */
    
    function showHistory() {
    
    const history =
        JSON.parse(
            localStorage.getItem(
                "touchGrassHistory"
            ) || "[]"
        );
    
    const app =
        document.getElementById(
            "app"
        );
    
    if (history.length === 0) {
    
        app.innerHTML = `
    
            <div class="reflection">
    
                <div class="reflection-icon">
                    📖
                </div>
    
                <h1>
                    No Missions Yet
                </h1>
    
                <p class="reflection-text">
                    Complete your first outdoor
                    mission and your history
                    will appear here.
                </p>
    
                <button
                    onclick="location.reload()"
                >
                    🌱 Start a Mission
                </button>
    
            </div>
    
        `;
    
        return;
    }
    
    let totalMinutes = 0;
    
    history.forEach(
        function(item) {
    
            totalMinutes +=
                Number(
                    item.minutes || 0
                );
    
        }
    );
    
    let historyHTML = "";
    
    history
        .slice()
        .reverse()
        .forEach(
            function(item, index) {
    
                let reflectionHTML = "";
    
                if (item.reflection) {
    
                    reflectionHTML = `
                        <br><br>
                        💭
                        ${escapeHTML(
                            item.reflection
                        )}
                    `;
    
                }
    
                let missionHTML = "";
    
                if (
                    item.mission &&
                    item.mission.title
                ) {
    
                    missionHTML = `
                        <br>
                        🎯
                        ${escapeHTML(
                            item.mission.title
                        )}
                    `;
    
                }
    
                historyHTML += `
    
                    <div class="history-card">
    
                        <strong>
                            🌱 Session
                            ${history.length - index}
                        </strong>
    
                        <br>
    
                        📅
                        ${escapeHTML(
                            item.date || ""
                        )}
    
                        <br>
    
                        ⏱️
                        ${Number(
                            item.minutes || 0
                        )}
                        minutes outside
    
                        ${missionHTML}
    
                        ${reflectionHTML}
    
                    </div>
    
                `;
    
            }
        );
    
    app.innerHTML = `
    
        <div class="reflection">
    
            <div class="reflection-icon">
                📖
            </div>
    
            <h1>
                My Outdoor History
            </h1>
    
            <p class="reflection-text">
                Your outdoor adventures,
                stored only on this device.
            </p>
    
            <div class="score-card">
    
                <div class="score-number">
                    ${totalMinutes}
                </div>
    
                <div class="score-label">
                    TOTAL MINUTES OUTSIDE
                </div>
    
                <br>
    
                <div class="score-label">
                    ${history.length}
                    OUTDOOR SESSIONS
                </div>
    
            </div>
    
            ${historyHTML}
    
            <div class="privacy-note">
                🔒 Everything shown here is
                stored locally in your browser.
            </div>
    
            <button
                onclick="location.reload()"
            >
                🌱 Start Another Mission
            </button>
    
            <button
                class="danger-button"
                onclick="clearHistory()"
            >
                🗑️ Clear History
            </button>
    
        </div>
    
    `;
    
    }
    
    /* Escape user text before displaying it */
    
    function escapeHTML(text) {
    
    const div =
        document.createElement(
            "div"
        );
    
    div.textContent =
        text;
    
    return div.innerHTML;
    
    }
    
    /* Clear history */
    
    function clearHistory() {
    
    const confirmed =
        confirm(
            "Delete all TouchGrass AI history from this device?"
        );
    
    if (!confirmed) {
        return;
    }
    
    localStorage.removeItem(
        "touchGrassHistory"
    );
    
    showHistory();
    
    }
    
    /* Reset current mission */
    
    function resetMission() {
    
    if (timerInterval) {
    
        clearInterval(
            timerInterval
        );
    
        timerInterval = null;
    }
